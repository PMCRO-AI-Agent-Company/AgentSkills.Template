id: uncertainty-decomposition
family: Family 3 — Iterative / Reflective
reasoning:
  logical_paradigms:
  - deductive
  - abductive
  operational_methods:
  - linear_cot
  domain_capabilities:
  - multi_hop_relational
  - common_sense
  - strategic_agentic
purpose: |
  Make uncertainty explicit by separating what is known, what is unknown, and
  what is assumed before attempting a solution.
when_to_use:
- High-stakes decisions with incomplete information
- Analysis where hidden assumptions could invalidate conclusions
- Situations where stakeholders need to understand confidence levels
when_not_to_use:
- Complete-information problems with deterministic answers
- Simple factual lookups where uncertainty is negligible
workflow:
- Restate the goal.
- 'List Knowns: facts that are established and reliable.'
- 'List Unknowns: information that is missing and would change the answer if known.'
- 'List Assumptions: beliefs treated as true for this analysis, with an explicit confidence level (high/medium/low).'
- Reason to a conclusion using only the knowns and stated assumptions.
- Flag which assumptions most critically affect the conclusion and what evidence would upgrade or invalidate them.
validation:
- Knowns, Unknowns, and Assumptions were listed separately before reasoning
- Conclusion is explicitly conditional on stated assumptions
- Key assumptions affecting the conclusion are flagged with confidence levels
steps_description: knowns/unknowns/assumptions and the conditional conclusion
