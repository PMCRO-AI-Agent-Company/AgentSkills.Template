id: plan-and-execute
family: Family 1 — Linear / Sequential
reasoning:
  logical_paradigms:
  - deductive
  - abductive
  operational_methods:
  - linear_cot
  - strategic_agentic
  domain_capabilities:
  - strategic_agentic
purpose: |
  Separate planning from execution so the approach is visible and adjustable.
when_to_use:
- Multi-step projects, coding tasks, research workflows
when_not_to_use:
- Single-shot factual questions
workflow:
- Restate the goal and constraints.
- Produce a numbered plan of concrete steps.
- Execute steps in order, recording results.
- Adjust the plan only when a step fails or new information appears.
- Summarize outcome against the original plan.
validation:
- Steps above were followed in order
- Final answer is grounded in the produced intermediate work
steps_description: the plan plus execution notes for each step
