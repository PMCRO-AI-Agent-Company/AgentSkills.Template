id: progressive-deepening
family: Family 2 — Search / Exploration
reasoning:
  logical_paradigms:
  - abductive
  - deductive
  operational_methods:
  - branching_search
  - test_time_compute
  domain_capabilities:
  - strategic_agentic
purpose: |
  Allocate depth where it pays off instead of uniform deep analysis.
when_to_use:
- Broad design spaces, research, option evaluation
when_not_to_use:
- Problems that require uniform full detail on every part
workflow:
- Survey the space at a shallow level.
- Identify the most promising 1–3 branches.
- Deepen only those branches.
- Reassess and deepen further if needed.
- Deliver the best-supported conclusion.
validation:
- Steps above were followed in order
- Final answer is grounded in the produced intermediate work
steps_description: shallow survey, then deepened branches
