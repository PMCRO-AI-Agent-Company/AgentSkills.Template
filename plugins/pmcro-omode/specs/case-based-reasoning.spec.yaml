id: case-based-reasoning
family: Family 5 — Analogical & Case-Based
reasoning:
  logical_paradigms:
  - analogical
  - inductive
  operational_methods:
  - linear_cot
  domain_capabilities:
  - common_sense
  - multi_hop_relational
purpose: |
  Reuse and adapt solutions from similar prior situations.
when_to_use:
- Recurring operational problems, support issues, design patterns
when_not_to_use:
- Truly novel problems with no useful precedent
workflow:
- Describe the current problem features.
- Retrieve 1–3 similar past cases.
- Compare similarities and differences.
- Adapt the prior solution to the differences.
- Apply and note what to remember for next time.
validation:
- Steps above were followed in order
- Final answer is grounded in the produced intermediate work
steps_description: retrieved cases and the adaptation
