apiVersion: pmcro.ai/v1
kind: ColonyRuntime
metadata:
  colony_id: pmcro-runtime
  version: "1.0.0"
  runtime_root: ".pmcro"
spec:
  trail_class: "B"
  enforce_atomic_file_protocol: true
  max_loop_limit: 5
  storage:
    trails: ".pmcro/trails"
    queue: ".pmcro/queue"
    state: ".pmcro/state"
    memory: ".pmcro/memory"
    policies: ".pmcro/policies"
  active_roles:
    - orchestrator
    - planner
    - maker
    - checker
    - reflector
    # trail removed 2026-09-05: sealing/trail-materialization is owned by
    # reflector (see .pmcro/policies/permissions.yaml: reflector may seal-cycle).
    # Not a standalone role. See .pmcro/design/AUDIT-pmcro-directory-2026-09-05.md #2.
